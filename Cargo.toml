[package]
name = "gamehaven"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
crc32fast = "1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wayland", "wgpu", "x11"] }
egui-file-dialog = { version = "0.16", default-features = false, features = ["default_fonts"] }
fontique = "0.11"
keyvalues-parser = "0.2.4"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3.5", features = ["json"] }
